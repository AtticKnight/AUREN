name: Verify covariance through the risk endpoint
on:
  push:
    branches:
      - verify/portfolio-correlation-precision
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install project requirements
        run: python -m pip install -r requirements.txt
      - name: Confirm the new endpoint test fails on the original response
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys
          path = Path("backend/app/services/analytics.py")
          fixed = path.read_bytes()
          try:
              path.write_bytes(subprocess.check_output(["git", "show", "b8f36cc3b4a4204835b309efbe4e3a35c66fbb35:backend/app/services/analytics.py"]))
              result = subprocess.run([sys.executable, "-m", "pytest", "-q", "tests/test_api.py::test_risk_returns_a_valid_correlation_matrix"], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print(result.stdout)
              assert result.returncode == 1 and "-0.00409" in result.stdout, "Expected the published matrix to have a negative eigenvalue"
          finally:
              path.write_bytes(fixed)
      - name: Run the API and engine suites on the fixed response
        run: python -m pytest -q
